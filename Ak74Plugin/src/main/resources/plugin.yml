# ============================================================
#  Ak74Plugin — AK-74 с очередью, умной перезарядкой и крафтом
#  Совместим с Purpur 26.3 / Paper 26.3
# ============================================================

name: Ak74Plugin
version: 1.2.0
main: com.example.ak74.Ak74Plugin
api-version: '26.3'
author: Example
description: AK-74 (магазин 30 патронов) со стрельбой очередью на ЛКМ, умной перезарядкой на ПКМ и крафтом оружия/патронов.
website: https://example.com
folia-supported: false

# ============================================================
#  Команды
# ============================================================
commands:
  ak74:
    description: Выдать AK-74 или патроны 5.45×39
    usage: /ak74 <give|ammo>
    permission: ak74.admin
    permission-message: §cУ вас нет прав на использование этой команды.
    aliases:
      - kalash
      - ak

# ============================================================
#  Права (permissions)
# ============================================================
permissions:
  ak74.admin:
    description: Доступ к команде /ak74 (выдача оружия и патронов)
    default: op